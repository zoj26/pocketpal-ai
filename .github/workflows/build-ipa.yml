name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - name: Create empty Env config
        run: |
          mkdir -p ios/Config
          touch ios/Config/Env.xcconfig

      - name: Create placeholder GoogleService-Info.plist
        run: |
          cat > ios/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          EOF

      - run: cd ios && pod install

      - name: Archive
        run: |
          cd ios
          xcodebuild archive \
            -workspace PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -archivePath build/PocketPal.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          cd ios/build
          mkdir Payload
          cp -r PocketPal.xcarchive/Products/Applications/*.app Payload/
          zip -r PocketPal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPal-ipa
          path: ios/build/PocketPal.ipa
